<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/registro.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="icon" type="image/x-icon" href="../img/logo_blanco.png">
  <title>Registrate</title>
</head>

<body>
  <header>
    <nav class="navbarra">
      <div class="logo">OnTrack</div>
      <ul class="nav-links">
        <li><a href="/">Inicio</a></li>
      </ul>
    </nav>
  </header>

  <div class="contenedor">
    <div class="left">
      <form class="register-form" id="idForm">
        <h2>Registrarse</h2>
        <p class="login-link">¿Ya tienes una cuenta? <a href="login">Inicia sesión aquí</a></p>

        <div class="usuario">
          <label for="username"></label>
          <input type="text" id="user" class="user" name="usuario" placeholder="Usuario" required />
          <i class='bx bxs-user'></i>
        </div>

        <div class="correo">
          <label for="email"></label>
          <input type="email" id="email" class="email" name="email" placeholder="Correo electrónico" required />
          <i class='bx bxl-gmail'></i>
        </div>

        <div class="contraseña">
          <label for="PsswRegis"></label>
          <input type="password" name="password" id="PsswRegis" placeholder="Contraseña" required>
          <i class='bx bxs-lock-alt' id="IconPsswRegis"></i>
        </div>
        <div class="localidad">
          <label for="localidad"></label>
          <select id="localidad" name="localidad" required>
            <option value="" disabled selected>Cargando Localidades/Ciudades...</option>
          </select>
          <i class='bx bxs-city'></i>
        </div>
        <div class="fecha">
          <input type="date" id="fecha" name="fecha" required>
        </div>

        <div class="genero">
          <label class="genero-opcion">
            <input type="radio" name="genero" id="genero-opcion" value="Mujer" required>
            <span>Mujer</span>
          </label>
          <label class="genero-opcion">
            <input type="radio" name="genero" id="genero-opcion" value="Hombre">
            <span>Hombre</span>
          </label>
          <label class="genero-opcion">
            <input type="radio" name="genero" id="genero-opcion" value="Otro">
            <span>Otro</span>
          </label>
        </div>

        <button type="submit">Crear cuenta</button>
      </form>
    </div>
    <div class="right">
      </div>

  </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/registro.js"></script> 

</html>
